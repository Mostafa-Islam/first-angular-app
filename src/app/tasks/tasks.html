@if (isAddingTask){
<app-new-task (cancel)="onCancelAddTask()" (add)="onAddTask($event)" />
}
<section id="tasks">
    <header>
        <h2>{{ name }}'s Tasks</h2>
        <button (click)="onStartAddTask()"> Add Task </button>
    </header>
    <ul>
        @for (task of selectedUserTasks; track task.id) {
        <li>
            <app-task [task]="task" (complete)="onComplete($event)" />
        </li>
        }

    </ul>
</section>
